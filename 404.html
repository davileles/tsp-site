<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tica Promos mudou de endereço</title>
<!-- Domínio antigo (tudosobrepromos.com, não renovado). Tudo vai para ticapromos.com.br.
     Canonical + refresh imediato: o Google trata como mudança permanente.
     O JS repassa ?utm_... e #âncora, para anúncios antigos não perderem rastreio. -->
<link rel="canonical" href="https://ticapromos.com.br/"/>
<meta http-equiv="refresh" content="0; url=https://ticapromos.com.br/"/>
<script>location.replace('https://ticapromos.com.br/' + location.search + location.hash);</script>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#1a1a1a;text-align:center;padding:16px}a{color:#0a7c4a;font-weight:600}</style>
</head>
<body>
<p>O Tica Promos agora está em <a href="https://ticapromos.com.br/">ticapromos.com.br</a>.</p>
</body>
</html>
